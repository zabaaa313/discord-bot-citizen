services:
  - type: web
    name: citizen-bot
    runtime: python
    plan: starter          # najtańszy płatny plan (~$7/mies.); darmowy free plan usypia kontener
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true       # automatyczny deploy po pushu na GitHub
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false        # wartość wpisujesz w panelu Render, nie w repo
      - key: CLIENT_ID
        sync: false
      - key: HTTP_PORT
        value: "3000"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PUBLIC_URL
        sync: false        # np. https://citizen-bot-xxxx.onrender.com
